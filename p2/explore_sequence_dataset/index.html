<!DOCTYPE html>
<html>

<head>
    <title>Pixel 9 - Edge NPU Inference</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #222;
            color: white;
            padding: 10px;
        }

        #status {
            font-size: 24px;
            margin-top: 15px;
            font-weight: bold;
            color: yellow;
        }

        #debug {
            font-size: 16px;
            color: #aaa;
            margin-top: 5px;
            font-family: monospace;
        }

        /* Add a visual container so you know the video is actually updating */
        #preview_canvas {
            width: 100%;
            max-width: 600px;
            border: 3px solid #555;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h2>Wizard of Oz - Stable Snapshot</h2>

    <canvas id="preview_canvas"></canvas>

    <div id="status">Initializing System...</div>
    <div id="debug">Buffer: 0/30 frames</div>

    <script>
        ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";
        ort.env.wasm.numThreads = 1;

        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug');

        // We recycle ONE canvas to prevent memory leaks
        const previewCanvas = document.getElementById('preview_canvas');
        const previewCtx = previewCanvas.getContext('2d', { willReadFrequently: true });

        let ortSession = null;
        let sequenceBuffer = [];
        let lastKnownLandmarks = new Array(63).fill(0.0);

        async function loadModel() {
            const cacheBuster = '?t=' + new Date().getTime();
            const [modelResponse, dataResponse] = await Promise.all([
                fetch('/temporal_cnn_monolithic.onnx' + cacheBuster),
                fetch('/temporal_cnn_monolithic.onnx.data' + cacheBuster)
            ]);

            if (!modelResponse.ok) throw new Error("Missing .onnx");
            if (!dataResponse.ok) throw new Error("Missing .data");

            const sessionOptions = {
                executionProviders: ['wasm'],
                intraOpNumThreads: 1,
                interOpNumThreads: 1,
                externalData: [{ data: new Uint8Array(await dataResponse.arrayBuffer()), path: 'temporal_cnn_monolithic.onnx.data' }]
            };

            ortSession = await ort.InferenceSession.create(await modelResponse.arrayBuffer(), sessionOptions);
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.5 });

        hands.onResults(async (results) => {
            let currentLandmarks = [];
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                let lm_list = results.multiHandLandmarks[0];
                for (let i = 0; i < 21; i++) {
                    currentLandmarks.push(lm_list[i].x, lm_list[i].y, lm_list[i].z);
                }
                lastKnownLandmarks = currentLandmarks;
            } else {
                currentLandmarks = lastKnownLandmarks;
            }

            sequenceBuffer.push(currentLandmarks);
            if (sequenceBuffer.length > 30) sequenceBuffer.shift();

            debugDiv.innerText = `Buffer: ${sequenceBuffer.length}/30 frames`;

            if (sequenceBuffer.length === 30 && ortSession) {
                let flatData = new Float32Array(1 * 63 * 30);
                for (let feat = 0; feat < 63; feat++) {
                    for (let seq = 0; seq < 30; seq++) {
                        flatData[feat * 30 + seq] = sequenceBuffer[seq][feat];
                    }
                }

                try {
                    const tensor = new ort.Tensor('float32', flatData, [1, 63, 30]);
                    const output = await ortSession.run({ 'input': tensor });
                    const logits = output['output'].data;

                    let exp0 = Math.exp(logits[0]);
                    let exp1 = Math.exp(logits[1]);
                    let prob1 = exp1 / (exp0 + exp1);
                    let percent = (prob1 * 100).toFixed(1);

                    if (prob1 > 0.80) {
                        statusDiv.innerText = `HANDSHAKE! (${percent}%)`;
                        statusDiv.style.color = "lime";
                        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    } else {
                        statusDiv.innerText = `Observing... (${percent}%)`;
                        statusDiv.style.color = "white";
                    }
                } catch (inferError) {
                    console.error(inferError);
                }
            }
        });

        // 4. Memory-Safe Polling Loop
        // We only create ONE image object and reuse it forever
        const snapshotImg = new Image();

        snapshotImg.onload = async () => {
            try {
                // Resize canvas to match the Mac's camera resolution
                if (previewCanvas.width !== snapshotImg.width) {
                    previewCanvas.width = snapshotImg.width;
                    previewCanvas.height = snapshotImg.height;
                }

                // Paint the image to the canvas
                previewCtx.drawImage(snapshotImg, 0, 0);

                // Hand the safe canvas to MediaPipe
                await hands.send({ image: previewCanvas });
            } catch (e) {
                debugDiv.innerText = "Tracker Error: " + e.message;
            }

            // Wait ~33ms, then fetch the next frame
            setTimeout(() => {
                snapshotImg.src = '/snapshot?t=' + new Date().getTime();
            }, 33);
        };

        snapshotImg.onerror = () => {
            // If the Mac drops a frame, just try again
            setTimeout(() => {
                snapshotImg.src = '/snapshot?t=' + new Date().getTime();
            }, 33);
        };

        async function bootSystem() {
            try {
                statusDiv.innerText = "1/2: Loading NPU...";
                await loadModel();
                statusDiv.innerText = "2/2: Loading Tracker (Wait 10s)...";
                await hands.initialize();

                statusDiv.innerText = "All Systems Go! Step into frame.";
                statusDiv.style.color = "lightgreen";

                // Kick off the loop
                snapshotImg.src = '/snapshot?t=' + new Date().getTime();
            } catch (error) {
                statusDiv.innerText = "Boot Failed: " + error.message;
                statusDiv.style.color = "red";
            }
        }

        bootSystem();
    </script>
</body>

</html>
